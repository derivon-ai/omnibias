line-length = 100
target-version = "py310"
extend-exclude = ["build", "dist", "site"]

[lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[lint.per-file-ignores]
"tests/**" = ["E402", "F401"]
"packages/*/tests/**" = ["E402", "F401"]
"packages/omnibias-*/src/omnibias/*/__init__.py" = ["F401"]
