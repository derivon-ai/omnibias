site_name: omnibias
site_description: Differentiable derivative primitives for Physics-Informed Neural Networks
site_url: https://omnibias.ai/
repo_name: omnibias
repo_url: https://github.com/derivon-ai/omnibias
docs_dir: docs
site_dir: site

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - md_in_html
  - tables
  - fenced_code
  - toc:
      permalink: true

