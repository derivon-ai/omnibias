site_name: omnibias
site_description: Numerically-stable closed-form n-th derivative forward-pass framework
site_url: https://omnibias.ai/
repo_name: omnibias
repo_url: https://github.com/derivon-ai/omnibias
docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

exclude_docs: |
  internal/
  design/
  math_validation_matrix.md
  backend_parity_matrix.md
  release_blockers.md
  release-readiness.md
  CLA.md
  img/generate_figures.py

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths:
            - packages/omnibias-core/src
            - packages/omnibias-torch/src
            - packages/omnibias-jax/src
            - packages/omnibias-ferminet/src
            - packages/omnibias-fields/src
            - packages/omnibias-pinn/src
            - packages/omnibias-qpinn/src
            - packages/omnibias-curvature/src
            - packages/omnibias-keras/src
            - packages/omnibias-geometry/src
            - packages/omnibias-fractional/src
            - packages/omnibias-measure/src
            - packages/omnibias-score/src
            - packages/omnibias-variational/src
            - packages/omnibias-symbolic/src
            - packages/omnibias-binary/src
            - packages/omnibias-boolean/src
            - packages/omnibias-verify/src
            - packages/omnibias-dynamics/src
            - packages/omnibias-spiking/src
            - packages/omnibias-hopfield/src
            - packages/omnibias-convex/src
            - packages/omnibias-graph/src
            - packages/omnibias-shape/src
            - packages/omnibias-skills/src
            - packages/omnibias-formal/src
            - packages/omnibias-sos/src
            - packages/omnibias-control/src
            - packages/omnibias-routing/src
            - packages/omnibias-discrete/src
            - packages/omnibias-qubo/src
            - packages/omnibias-submodular/src
            - packages/omnibias-nphard/src
            - packages/omnibias-combinatorics/src
            - packages/omnibias-logic/src
            - packages/omnibias-struct/src
            - packages/omnibias-difference/src
            - packages/omnibias-qcalculus/src
            - packages/omnibias-timescale/src
            - packages/omnibias-holonomic/src
            - packages/omnibias-tab/src
            - packages/omnibias-partition/src
          options:
            show_root_heading: true
            show_source: false
            members_order: source
            docstring_style: numpy
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - tables
  - footnotes
  - toc:
      permalink: true

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

