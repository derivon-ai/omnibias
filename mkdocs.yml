site_name: omnibias
site_description: Differentiable derivative primitives for Physics-Informed Neural Networks
site_url: https://omnibias.ai/
repo_name: omnibias
repo_url: https://github.com/derivon-ai/omnibias
docs_dir: docs
site_dir: site

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - md_in_html
  - tables
  - fenced_code
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Capabilities and mechanisms: capabilities.md
  - PINN integration: pinn.md
  - Derivative APIs: derivatives.md
  - Performance: performance.md
  - Guarantees and limits: guarantees.md
  - Package map: packages.md
  - License transition: license-transition.md
  - Commercial strategy: commercial-strategy.md
  - Numerical maintenance: development/numerical-contracts.md
  - Migration validation: development/open-core-migration.md
  - Merge-readiness audit: development/merge-readiness-audit.md
  - API entry points:
      - core: api/core.md
      - torch: api/torch.md
      - jax: api/jax.md
      - keras: api/keras.md
      - fields: api/fields.md
      - difference: api/difference.md
      - partition: api/partition.md
      - discrete: api/discrete.md
      - struct: api/struct.md
      - binary: api/binary.md
      - boolean: api/boolean.md
      - qcalculus: api/qcalculus.md
      - convex: api/convex.md
      - sos: api/sos.md
      - curvature: api/curvature.md
      - graph: api/graph.md
