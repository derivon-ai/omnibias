[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnibias-curvature"
version = "0.1.0a2"
description = "Closed-form parameter Hessian / Gauss-Newton Fisher / KFAC factors for one-hidden-layer Riccati fields, built on the omnibias closed-form σ' / σ'' primitives."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later OR LicenseRef-omnibias-Commercial"
license-files = ["LICENSE", "NOTICE", "COMMERCIAL-LICENSE.md"]
authors = [{ name = "Vardan Grigoryants", email = "vardan@derivon.ai" }]
maintainers = [{ name = "Derivon", email = "info@derivon.ai" }]
keywords = ["second-order-optimization", "fisher-information", "kfac", "riccati", "natural-gradient", "closed-form-hessian"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "omnibias-core>=0.5.0rc1",
    "omnibias-jax>=0.5.0rc1",
    "jax>=0.4.30",
    "numpy>=1.23",
]

[project.optional-dependencies]
torch = ["omnibias-torch>=0.5.0rc1", "torch>=2.0"]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/derivon-ai/omnibias"
Documentation = "https://github.com/derivon-ai/omnibias/blob/main/docs/api/curvature.md"
Source = "https://github.com/derivon-ai/omnibias"
Issues = "https://github.com/derivon-ai/omnibias/issues"
Changelog = "https://github.com/derivon-ai/omnibias/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["omnibias.*"]

[tool.setuptools.package-data]
"omnibias.curvature" = ["py.typed"]
