[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnibias-dynamics"
version = "0.1.0a1"
description = "Computer-assisted dynamics: validated variational / monodromy flows, Poincare-section enclosures, certified Lyapunov-exponent bounds, and rigorous periodic-orbit existence via the radii-polynomial approach. Built on the omnibias closed-form variational tower and the QR-Lohner / Newton-Kantorovich machinery in omnibias.core.verified."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later OR LicenseRef-omnibias-Commercial"
license-files = ["LICENSE"]
authors = [{ name = "Vardan Grigoryants", email = "vardan@derivon.ai" }]
maintainers = [{ name = "Derivon", email = "info@derivon.ai" }]
keywords = [
    "validated-numerics",
    "computer-assisted-proof",
    "dynamical-systems",
    "periodic-orbits",
    "lyapunov-exponents",
    "interval-arithmetic",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["omnibias-core>=0.2.0"]

[project.optional-dependencies]
test = ["pytest>=7.0", "numpy>=1.24"]
dev = ["omnibias-dynamics[test]", "ruff>=0.1.0", "mypy>=1.5"]

[project.urls]
Homepage = "https://github.com/derivon-ai/omnibias"
Documentation = "https://omnibias.ai/"
Source = "https://github.com/derivon-ai/omnibias"
Issues = "https://github.com/derivon-ai/omnibias/issues"
Changelog = "https://github.com/derivon-ai/omnibias/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["omnibias.*"]

[tool.setuptools.package-data]
"omnibias.dynamics" = ["py.typed"]
