[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnibias-difference"
version = "0.1.0a1"
description = "The founding delta->0 (multi-bias collapse) register: certified finite-difference -> derivative extraction, umbral / Sheffer sequence calculus, and asymptotic-coefficient reading (Stirling / Bernoulli / Euler numbers) read straight off the closed-form omnibias towers. Pure-Python core + rigorous interval-tower certificates from omnibias.core.verified, with bit-identical torch/jax twins for the finite-difference stencil operator."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Vardan Grigoryants", email = "vardan@derivon.ai" }]
maintainers = [{ name = "Derivon", email = "info@derivon.ai" }]
keywords = [
    "finite-differences",
    "umbral-calculus",
    "analytic-combinatorics",
    "stirling-numbers",
    "bernoulli-numbers",
    "euler-numbers",
    "interval-arithmetic",
    "closed-form-derivatives",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["omnibias-core>=0.2.0"]

[project.optional-dependencies]
torch = ["torch>=2.0", "omnibias-torch>=0.2.0"]
jax = ["jax>=0.4", "omnibias-jax>=0.2.0"]
test = ["pytest>=7.0", "numpy>=1.24", "mpmath>=1.3"]
dev = ["omnibias-difference[test]", "ruff>=0.1.0", "mypy>=1.5"]

[project.urls]
Homepage = "https://github.com/derivon-ai/omnibias"
Documentation = "https://omnibias.ai/"
Source = "https://github.com/derivon-ai/omnibias"
Issues = "https://github.com/derivon-ai/omnibias/issues"
Changelog = "https://github.com/derivon-ai/omnibias/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["omnibias.*"]

[tool.setuptools.package-data]
"omnibias.difference" = ["py.typed"]
