[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnibias-qcalculus"
version = "0.1.0a1"
description = "Quantum / q-calculus: exact q-numbers, q-factorials, Gaussian (q-)binomials and q-Pochhammer symbols, the Jackson q-derivative and q-integral, q-exponentials and q-deformed Bernoulli / Euler numbers, and basic hypergeometric series with certified geometric tails. The q -> 1 limit recovers ordinary calculus (a distinct limit, never conflated with the delta -> 0 founding collapse). Built on omnibias-core and omnibias-difference, with bit-identical torch/jax Jackson-derivative twins."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Vardan Grigoryants", email = "vardan@derivon.ai" }]
maintainers = [{ name = "Derivon", email = "info@derivon.ai" }]
keywords = [
    "q-calculus",
    "quantum-calculus",
    "jackson-derivative",
    "basic-hypergeometric",
    "gaussian-binomial",
    "q-series",
    "interval-arithmetic",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["omnibias-core>=0.2.0", "omnibias-difference>=0.1.0a1"]

[project.optional-dependencies]
torch = ["torch>=2.0", "omnibias-torch>=0.2.0"]
jax = ["jax>=0.4", "omnibias-jax>=0.2.0"]
test = ["pytest>=7.0", "numpy>=1.24", "mpmath>=1.3"]
dev = ["omnibias-qcalculus[test]", "ruff>=0.1.0", "mypy>=1.5"]

[project.urls]
Homepage = "https://github.com/derivon-ai/omnibias"
Documentation = "https://omnibias.ai/"
Source = "https://github.com/derivon-ai/omnibias"
Issues = "https://github.com/derivon-ai/omnibias/issues"
Changelog = "https://github.com/derivon-ai/omnibias/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["omnibias.*"]

[tool.setuptools.package-data]
"omnibias.qcalculus" = ["py.typed"]
