[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnibias-geometry"
version = "0.2.0"
description = "Differential geometry on manifolds for omnibias: metric tensor, Christoffel symbols, covariant derivative, the Laplace-Beltrami operator, Riemann/Ricci/scalar curvature, geodesics, exterior calculus (d, wedge, Hodge star, codifferential), and the pullback metric of a learned chart (g = J^T h J) for learned manifolds. Built on the omnibias-fields substrate with cross-backend (torch + jax) parity."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Vardan Grigoryants", email = "vardan@derivon.ai" }]
maintainers = [{ name = "Derivon", email = "info@derivon.ai" }]
keywords = [
    "differential-geometry",
    "riemannian-geometry",
    "laplace-beltrami",
    "curvature",
    "exterior-calculus",
    "pullback-metric",
    "learned-manifolds",
    "scientific-machine-learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
# ``omnibias-core`` arrives transitively through ``omnibias-fields``, but
# ``omnibias.geometry.gauge.transfer`` imports ``omnibias.core.verified`` directly
# (interval arithmetic, the spectral-gap engines, ``besseli_iv``), so the dependency
# is declared rather than inherited.
dependencies = ["omnibias-core>=0.2.0", "omnibias-fields>=0.1.0", "numpy>=1.24"]

[project.optional-dependencies]
torch = ["omnibias-fields[torch]", "torch>=2.0"]
jax = ["omnibias-fields[jax]", "jax>=0.4.30", "jaxlib>=0.4.30"]
# The learned-atlas bridge (``omnibias.geometry.atlas``) is built on the alpha
# ``omnibias-partition`` keystone; it is an opt-in extra so a default
# ``omnibias-geometry`` install never pulls an alpha prerelease.
atlas = ["omnibias-partition>=0.1.0a1"]
all = ["omnibias-geometry[torch,jax]"]
test = [
    "pytest>=7.0",
    "numpy>=1.24",
    "sympy>=1.12",
]
dev = [
    "omnibias-geometry[all,atlas,test]",
    "ruff>=0.1.0",
    "mypy>=1.5",
]

[project.urls]
Homepage = "https://github.com/derivon-ai/omnibias"
Documentation = "https://omnibias.ai/"
Source = "https://github.com/derivon-ai/omnibias"
Issues = "https://github.com/derivon-ai/omnibias/issues"
Changelog = "https://github.com/derivon-ai/omnibias/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["omnibias.*"]

[tool.setuptools.package-data]
"omnibias.geometry" = ["py.typed"]
