[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnibias-qpinn"
version = "0.0.2a1"
description = "Quantum-physics-informed neural networks with closed-form n-th derivative operators on top of omnibias-pinn. Cross-backend (torch + jax) residuals for Schrodinger / Gross-Pitaevskii / rotating-frame Gross-Pitaevskii / Helmholtz / Klein-Gordon / Dirac, plus norm-conservation, Bloch-periodic, and Hermitian-operator cages, parity-projection helpers, and vortex / Thomas-Fermi diagnostics for 2D rotating condensates."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Vardan Grigoryants", email = "vardan@derivon.ai" }]
maintainers = [{ name = "Derivon", email = "info@derivon.ai" }]
keywords = [
    "physics-informed-neural-networks",
    "pinn",
    "quantum-mechanics",
    "schrodinger-equation",
    "dirac-equation",
    "gross-pitaevskii",
    "closed-form-derivatives",
    "scientific-machine-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "omnibias-core>=0.2.0",
    "omnibias-pinn>=0.1.0",
]

[project.optional-dependencies]
torch = ["omnibias-torch>=0.2.0", "torch>=2.0"]
jax = ["omnibias-jax>=0.2.0", "jax>=0.4.30", "jaxlib>=0.4.30"]
all = ["omnibias-qpinn[torch,jax]"]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "numpy>=1.24",
]
dev = [
    "omnibias-qpinn[all,test]",
    "ruff>=0.1.0",
    "mypy>=1.5",
]

[project.urls]
Homepage = "https://github.com/derivon-ai/omnibias"
Documentation = "https://omnibias.ai/"
Source = "https://github.com/derivon-ai/omnibias"
Issues = "https://github.com/derivon-ai/omnibias/issues"
Changelog = "https://github.com/derivon-ai/omnibias/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["omnibias.*"]

[tool.setuptools.package-data]
"omnibias.qpinn" = ["py.typed"]
