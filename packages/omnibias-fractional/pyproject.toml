[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnibias-fractional"
version = "0.1.0"
description = "Fractional calculus for omnibias in two honest classes: (1) grid/spectral Grunwald-Letnikov / Riemann-Liouville / Caputo / FFT operators -- non-local NUMERICAL approximations (accuracy set by the grid), NOT closed form; and (2) a closed-form analytic fractional derivative on the analytic-function class (gamma-ratio Taylor-jet series with differentiable order; an order-N truncation, exact for polynomials of degree <= N)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Vardan Grigoryants", email = "vardan@derivon.ai" }]
maintainers = [{ name = "Derivon", email = "info@derivon.ai" }]
keywords = [
    "fractional-calculus",
    "fractional-derivative",
    "grunwald-letnikov",
    "caputo",
    "spectral-methods",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = ["omnibias-core>=0.2.0", "numpy>=1.24"]

[project.optional-dependencies]
torch = ["torch>=2.0", "omnibias-torch>=0.2.0", "omnibias-fields[torch]>=0.1.0"]
jax = ["jax>=0.4.30", "jaxlib>=0.4.30", "omnibias-jax>=0.2.0", "omnibias-fields[jax]>=0.1.0"]
all = ["omnibias-fractional[torch,jax]"]
test = ["pytest>=7.0", "numpy>=1.24"]
dev = ["omnibias-fractional[all,test]", "ruff>=0.1.0", "mypy>=1.5"]

[project.urls]
Homepage = "https://github.com/derivon-ai/omnibias"
Documentation = "https://omnibias.ai/"
Source = "https://github.com/derivon-ai/omnibias"
Issues = "https://github.com/derivon-ai/omnibias/issues"
Changelog = "https://github.com/derivon-ai/omnibias/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["omnibias.*"]

[tool.setuptools.package-data]
"omnibias.fractional" = ["py.typed"]
