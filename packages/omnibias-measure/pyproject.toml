[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnibias-measure"
version = "0.1.0a1"
description = "Autograd-native measure-theoretic integration for omnibias: a Measure abstraction (discrete measure = nodes + weights, with pushforward / product / importance reweighting) and the measure integral int f dmu, plus the layer-cake / distribution-function formula, self-normalized importance-sampling expectations, and simple-function (from-below) approximation -- each with bit-identical torch + jax twins and trainable nn.Module / functional layers."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Vardan Grigoryants", email = "vardan@derivon.ai" }]
maintainers = [{ name = "Derivon", email = "info@derivon.ai" }]
keywords = [
    "measure-theory",
    "lebesgue-integral",
    "layer-cake",
    "importance-sampling",
    "differentiable-integration",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = ["omnibias-core>=0.2.0", "omnibias-fields>=0.1.0", "numpy>=1.24"]

[project.optional-dependencies]
torch = ["torch>=2.0", "omnibias-torch>=0.2.0", "omnibias-fields[torch]>=0.1.0"]
jax = ["jax>=0.4.30", "jaxlib>=0.4.30", "omnibias-jax>=0.2.0", "omnibias-fields[jax]>=0.1.0"]
all = ["omnibias-measure[torch,jax]"]
test = ["pytest>=7.0", "numpy>=1.24"]
dev = ["omnibias-measure[all,test]", "ruff>=0.1.0", "mypy>=1.5"]

[project.urls]
Homepage = "https://github.com/derivon-ai/omnibias"
Documentation = "https://omnibias.ai/"
Source = "https://github.com/derivon-ai/omnibias"
Issues = "https://github.com/derivon-ai/omnibias/issues"
Changelog = "https://github.com/derivon-ai/omnibias/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["omnibias.*"]

[tool.setuptools.package-data]
"omnibias.measure" = ["py.typed"]

[tool.mypy]
python_version = "3.10"
strict = true
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["torch.*", "jax.*", "jaxlib.*"]
ignore_missing_imports = true
