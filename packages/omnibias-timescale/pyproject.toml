[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnibias-timescale"
version = "0.1.0a1"
description = "Time-scale (Hilger) calculus unifying the continuous and discrete registers: a TimeScale (R, hZ, quantum q^Z, or a finite set) with forward/backward jump operators and graininess, the delta and nabla derivatives dispatching to the closed-form omnibias tower on R, the forward difference on hZ, and the Jackson q-derivative on q^Z, plus the delta integral, the Hilger exponential and its circle-plus group, and linear dynamic equations. The graininess mu -> 0 recovers the derivative tower -- the founding delta -> 0 bias collapse, generalized. Built on omnibias-core, omnibias-difference and omnibias-qcalculus, with bit-identical torch/jax delta-derivative twins."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Vardan Grigoryants", email = "vardan@derivon.ai" }]
maintainers = [{ name = "Derivon", email = "info@derivon.ai" }]
keywords = [
    "time-scale-calculus",
    "hilger-calculus",
    "dynamic-equations",
    "delta-derivative",
    "hilger-exponential",
    "quantum-calculus",
    "finite-differences",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "omnibias-core>=0.2.0",
    "omnibias-difference>=0.1.0a1",
    "omnibias-qcalculus>=0.1.0a1",
]

[project.optional-dependencies]
torch = ["torch>=2.0", "omnibias-torch>=0.2.0"]
jax = ["jax>=0.4", "omnibias-jax>=0.2.0"]
test = ["pytest>=7.0", "numpy>=1.24", "mpmath>=1.3"]
dev = ["omnibias-timescale[test]", "ruff>=0.1.0", "mypy>=1.5"]

[project.urls]
Homepage = "https://github.com/derivon-ai/omnibias"
Documentation = "https://omnibias.ai/"
Source = "https://github.com/derivon-ai/omnibias"
Issues = "https://github.com/derivon-ai/omnibias/issues"
Changelog = "https://github.com/derivon-ai/omnibias/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["omnibias.*"]

[tool.setuptools.package-data]
"omnibias.timescale" = ["py.typed"]
