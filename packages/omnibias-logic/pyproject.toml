[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnibias-logic"
version = "0.1.0a1"
description = "Differentiable + certified Boolean logic for omnibias: re-exports the weighted-MaxSAT DiscreteProblem consumer (annealed sigmoid relaxation + rounding / 1-flip decoder + Lasserre / SOS certified optimality gap) and adds (weighted) #SAT / model counting with rigorous inclusion-exclusion lower+upper count enclosures and a beta->inf annealed model-finder relaxation (torch + jax twins). yes-if: a certified count enclosure, never a P = NP / #P exactness claim."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later OR LicenseRef-omnibias-Commercial"
license-files = ["LICENSE"]
authors = [{ name = "Vardan Grigoryants", email = "vardan@derivon.ai" }]
maintainers = [{ name = "Derivon", email = "info@derivon.ai" }]
keywords = ["sat", "maxsat", "model-counting", "sharp-sat", "weighted-model-counting", "differentiable-logic", "inclusion-exclusion", "sum-of-squares", "verified-numerics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "omnibias-core>=0.2.0",
    "omnibias-discrete>=0.1.0a1",
    "omnibias-boolean>=0.1.0a1",
    "numpy>=1.24",
]

[project.optional-dependencies]
# the re-exported MaxSAT optimality-gap certificate (certify_gap) reuses the Lasserre /
# SOS bound over the Boolean hypercube from omnibias-sos; without it certify_gap degrades
# to a valid but non-sealed float bound (the #SAT count enclosure needs no backend at all).
sos = ["omnibias-sos>=0.1.0a1"]
# the differentiable annealed relaxations (temperature-axis feasibility penalty, unrolled
# for backprop) need a tensor backend; the model-count enclosure is pure Python.
torch = ["torch>=2.0", "omnibias-torch>=0.2.0"]
jax = ["jax>=0.4.30", "jaxlib>=0.4.30", "omnibias-jax>=0.2.0"]
all = ["omnibias-logic[sos,torch,jax]"]
test = ["pytest>=7.0", "numpy>=1.24"]
dev = ["omnibias-logic[all,test]", "ruff>=0.1.0", "mypy>=1.5"]

[project.urls]
Homepage = "https://github.com/derivon-ai/omnibias"
Documentation = "https://omnibias.ai/"
Source = "https://github.com/derivon-ai/omnibias"
Issues = "https://github.com/derivon-ai/omnibias/issues"
Changelog = "https://github.com/derivon-ai/omnibias/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["omnibias.*"]

[tool.setuptools.package-data]
"omnibias.logic" = ["py.typed"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
files = ["src/omnibias/logic"]
