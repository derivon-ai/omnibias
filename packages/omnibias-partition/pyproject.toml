[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnibias-partition"
version = "0.1.0a1"
description = "A light, certified soft partition-of-unity primitive: oblique / axis-aligned / sparse soft-split gates that route an input into 2**depth regions with weights that are non-negative and sum to one, harden to a crisp partition under temperature collapse (the beta -> inf penalty), carry a SOUND soft->hard membership-gap certificate (outward-rounded Interval + closed-form Gibbs bound), and expose a per-region model registry whose one combine() engine (sum_l w_l * out_l) is shared by every downstream bridge. Bit-identical numpy / torch / jax weights."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Vardan Grigoryants", email = "vardan@derivon.ai" }]
maintainers = [{ name = "Derivon", email = "info@derivon.ai" }]
keywords = ["partition-of-unity", "soft-trees", "mixture-of-experts", "differentiable", "certified-machine-learning", "domain-decomposition", "gating"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["omnibias-core>=0.2.0", "numpy>=1.24"]

[project.optional-dependencies]
# The bit-identical torch weight twin (autograd-friendly, embeddable in nn modules).
torch = ["torch>=2.0"]
# The bit-identical jax weight twin (jit / grad / vmap traceable).
jax = ["jax>=0.4.30", "jaxlib>=0.4.30"]
keras = ["keras>=3.0"]
all = ["omnibias-partition[torch,jax,keras]"]
test = ["pytest>=7.0", "numpy>=1.24"]
dev = ["omnibias-partition[all,test]", "ruff>=0.1.0", "mypy>=1.5"]

[project.urls]
Homepage = "https://github.com/derivon-ai/omnibias"
Documentation = "https://omnibias.ai/"
Source = "https://github.com/derivon-ai/omnibias"
Issues = "https://github.com/derivon-ai/omnibias/issues"
Changelog = "https://github.com/derivon-ai/omnibias/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["omnibias.*"]

[tool.setuptools.package-data]
"omnibias.partition" = ["py.typed"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
files = ["src/omnibias/partition"]
