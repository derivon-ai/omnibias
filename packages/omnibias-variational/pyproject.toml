[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnibias-variational"
version = "0.1.0a1"
description = "Least-action / variational calculus for omnibias: action integrals, Euler-Lagrange residuals, the arbitrary-order Euler-Poisson functional derivative, the first (Gateaux) variation, constrained (holonomic / isoperimetric) variational calculus, Hamiltonian / Noether machinery, classical field theory, geodesics-as-least-action, and symplectic integrators, with the trajectory derivatives supplied closed-form by the omnibias-fields sigma-tower and rigorous action enclosures from omnibias.core.verified."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Vardan Grigoryants", email = "vardan@derivon.ai" }]
maintainers = [{ name = "Derivon", email = "info@derivon.ai" }]
keywords = ["least-action", "variational-calculus", "euler-lagrange", "euler-poisson", "functional-derivative", "first-variation", "constrained-optimization", "lagrangian-mechanics", "hamiltonian", "noether", "symplectic-integrator"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["omnibias-fields>=0.1.0"]

[project.optional-dependencies]
torch = ["omnibias-fields[torch]", "torch>=2.0"]
jax = ["omnibias-fields[jax]", "jax>=0.4.30", "jaxlib>=0.4.30"]
geometry = ["omnibias-geometry>=0.2.0"]
all = ["omnibias-variational[torch,jax,geometry]"]
test = ["pytest>=7.0", "numpy>=1.24"]
dev = ["omnibias-variational[all,test]", "ruff>=0.1.0", "mypy>=1.5"]

[project.urls]
Homepage = "https://github.com/derivon-ai/omnibias"
Documentation = "https://omnibias.ai/"
Source = "https://github.com/derivon-ai/omnibias"
Issues = "https://github.com/derivon-ai/omnibias/issues"
Changelog = "https://github.com/derivon-ai/omnibias/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["omnibias.*"]

[tool.setuptools.package-data]
"omnibias.variational" = ["py.typed"]
