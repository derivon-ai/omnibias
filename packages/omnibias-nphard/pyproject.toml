[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnibias-nphard"
version = "0.1.0a1"
description = "Differentiable, certified heuristics for named NP-hard families (quadratic assignment, generalized assignment, parallel-machine scheduling) for omnibias: each family is encoded as a quadratic pseudo-Boolean (QUBO-form) energy on top of omnibias-qubo, relaxed by the annealed temperature-collapse (beta -> inf) penalty, decoded by a structure-preserving heuristic, and sandwiched by a rigorous -- but honestly non-tight -- optimality-gap certificate (spectral / SOS-Lasserre). Named classical baselines (scipy FAQ/2-opt QAP, LPT, LP relaxation) and a from-scratch MCTS search track that uses the differentiable relaxation as an AlphaZero-style prior. Bit-identical torch + jax twins."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later OR LicenseRef-omnibias-Commercial"
license-files = ["LICENSE"]
authors = [{ name = "Vardan Grigoryants", email = "vardan@derivon.ai" }]
maintainers = [{ name = "Derivon", email = "info@derivon.ai" }]
keywords = ["np-hard", "quadratic-assignment", "generalized-assignment", "scheduling", "qubo", "differentiable-optimization", "monte-carlo-tree-search", "sum-of-squares", "verified-numerics", "combinatorial-optimization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]
# omnibias-qubo supplies the QUBOProblem energy seam, the annealed relaxation, the
# decode / brute-force oracle and the spectral / SOS certificate; omnibias-discrete
# (also pulled by qubo) is declared directly for the shared decision-focused
# (SPO+ / normalized-regret) core; scipy supplies the named classical baselines
# (FAQ / 2-opt QAP, LP relaxation) and the LP solves.
dependencies = ["omnibias-core>=0.2.0", "omnibias-qubo>=0.1.0a1", "omnibias-discrete>=0.1.0a1", "numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
# the headline SOS / Lasserre certified lower bound (over the Boolean hypercube)
# reuses omnibias-sos; without it the certificate falls back to the spectral bound.
sos = ["omnibias-sos>=0.1.0a1"]
# the spectral lower bound's rigorous interval seal (Neumaier-Shcherbina / QP dual)
# reuses omnibias-convex; without it the spectral bound degrades to the (still valid)
# float value with certified=False.
convex = ["omnibias-convex>=0.1.0a1"]
# the differentiable annealed relaxation (temperature-collapse penalty,
# unrolled for backprop) needs a tensor backend.
torch = ["torch>=2.0", "omnibias-torch>=0.2.0"]
jax = ["jax>=0.4.30", "jaxlib>=0.4.30", "omnibias-jax>=0.2.0"]
# an optional exact CP-SAT baseline for generalized assignment; without it the GAP
# baseline is the scipy LP relaxation lower bound + a greedy feasible upper bound.
ortools = ["ortools>=9.7"]
all = ["omnibias-nphard[sos,convex,torch,jax]"]
test = ["pytest>=7.0", "numpy>=1.24", "scipy>=1.10"]
dev = ["omnibias-nphard[all,test]", "ruff>=0.1.0", "mypy>=1.5"]

[project.urls]
Homepage = "https://github.com/derivon-ai/omnibias"
Documentation = "https://omnibias.ai/"
Source = "https://github.com/derivon-ai/omnibias"
Issues = "https://github.com/derivon-ai/omnibias/issues"
Changelog = "https://github.com/derivon-ai/omnibias/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["omnibias.*"]

[tool.setuptools.package-data]
"omnibias.nphard" = ["py.typed"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
files = ["src/omnibias/nphard"]
