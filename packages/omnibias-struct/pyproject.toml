[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnibias-struct"
version = "0.1.0a1"
description = "Certified differentiable dynamic programming: soft Viterbi / shortest-path / CTC layers whose logsumexp_beta relaxation (the beta->inf temperature axis) is differentiated exactly by the closed-form softplus/sigmoid derivative tower (the delta->0 axis) via omnibias.{torch,jax}.jet, with a closed-form logsumexp_beta >= max gap certificate validated against brute-force hard DP; bit-identical torch + jax twins."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Vardan Grigoryants", email = "vardan@derivon.ai" }]
maintainers = [{ name = "Derivon", email = "info@derivon.ai" }]
keywords = [
    "dynamic-programming",
    "viterbi",
    "shortest-path",
    "connectionist-temporal-classification",
    "differentiable-dynamic-programming",
    "structured-prediction",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["omnibias-core>=0.2.0"]

[project.optional-dependencies]
torch = ["torch>=2.0", "omnibias-torch>=0.2.0"]
jax = ["jax>=0.4.30", "jaxlib>=0.4.30", "omnibias-jax>=0.2.0"]
all = ["omnibias-struct[torch,jax]"]
test = ["pytest>=7.0", "numpy>=1.24"]
dev = ["omnibias-struct[all,test]", "ruff>=0.1.0", "mypy>=1.5"]

[project.urls]
Homepage = "https://github.com/derivon-ai/omnibias"
Documentation = "https://omnibias.ai/"
Source = "https://github.com/derivon-ai/omnibias"
Issues = "https://github.com/derivon-ai/omnibias/issues"
Changelog = "https://github.com/derivon-ai/omnibias/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["omnibias.*"]

[tool.setuptools.package-data]
"omnibias.struct" = ["py.typed"]

[tool.mypy]
# Extension-tier package: authored strict-clean but kept off the shared
# ``mypy --strict`` CI gate (like the other extension packages).
python_version = "3.10"
strict = true
ignore_missing_imports = true
