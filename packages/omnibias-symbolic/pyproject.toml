[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnibias-symbolic"
version = "0.1.0"
description = "Neural-jet equation discovery and interpretable surrogate modeling for omnibias: a library-free SINDy variant (NeuralJetDiscoverer) that recovers closed-form differential identities from exact omnibias activation jets, AutoML over Taylor/Fourier libraries, PDE operator-coefficient recovery, and Blasius boundary-layer surrogates."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Vardan Grigoryants", email = "vardan@derivon.ai" }]
maintainers = [{ name = "Derivon", email = "info@derivon.ai" }]
keywords = ["neurosymbolic", "operator-learning", "sindy", "symbolic-regression", "equation-discovery"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = ["omnibias-core>=0.2.0", "omnibias-difference>=0.1.0a1", "omnibias-partition>=0.1.0a1", "numpy>=1.24"]

[project.optional-dependencies]
jax = ["omnibias-jax>=0.2.0", "jax>=0.4.30", "jaxlib>=0.4.30"]
sklearn = ["scikit-learn>=1.2"]
all = ["omnibias-symbolic[jax,sklearn]"]
test = [
    "pytest>=7.0",
    "numpy>=1.24",
    "omnibias-jax>=0.2.0",
    "omnibias-fractional>=0.1.0",
    # Only the integral-column builders need it, and only lazily, so it stays out
    # of the runtime dependencies: a discovery run that never asks for a Fredholm
    # column must not have to install a quadrature package.
    "omnibias-measure>=0.1.0a1",
    "scikit-learn>=1.2",
]
dev = [
    "omnibias-symbolic[all,test]",
    "ruff>=0.1.0",
    "mypy>=1.5",
]

[project.urls]
Homepage = "https://github.com/derivon-ai/omnibias"
Documentation = "https://omnibias.ai/"
Source = "https://github.com/derivon-ai/omnibias"
Issues = "https://github.com/derivon-ai/omnibias/issues"
Changelog = "https://github.com/derivon-ai/omnibias/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["omnibias.*"]

[tool.setuptools.package-data]
"omnibias.symbolic" = ["py.typed"]
