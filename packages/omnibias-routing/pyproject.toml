[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnibias-routing"
version = "0.1.0a1"
description = "Certified + differentiable combinatorial routing for omnibias: a poly-size Held-Karp / single-commodity-flow / assignment TSP relaxation solved differentiably by the temperature-collapse penalty, a heatmap + 2-opt tour decoder, and a rigorous optimality-gap certificate (Neumaier-Shcherbina LP lower bound vs a decoded tour), plus decision-focused predict-then-optimize routing (jax + torch)."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later OR LicenseRef-omnibias-Commercial"
license-files = ["LICENSE"]
authors = [{ name = "Vardan Grigoryants", email = "vardan@derivon.ai" }]
maintainers = [{ name = "Derivon", email = "info@derivon.ai" }]
keywords = ["traveling-salesman", "tsp", "routing", "held-karp", "differentiable-optimization", "decision-focused-learning", "verified-numerics", "combinatorial-optimization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]
# scipy solves the relaxation LP exactly (HiGHS) for the certificate's dual;
# omnibias-discrete supplies the shared decision-focused (SPO+ / normalized-regret) core.
dependencies = ["omnibias-core>=0.2.0", "omnibias-discrete>=0.1.0a1", "numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
# the certificate's rigorous interval seal (Neumaier-Shcherbina) reuses the
# omnibias-convex verified LP bound; without it the certificate degrades to the
# (still valid) float LP value (certified=False).
convex = ["omnibias-convex>=0.1.0a1"]
# the differentiable relaxation layers (same temperature-collapse penalty, unrolled +
# batched for backprop) need a tensor backend.
torch = ["torch>=2.0", "omnibias-torch>=0.2.0"]
jax = ["jax>=0.4.30", "jaxlib>=0.4.30", "omnibias-jax>=0.2.0"]
# omnibias-verify is available for downstream branch-and-bound (optional).
verify = ["omnibias-verify>=0.1.0a1"]
all = ["omnibias-routing[convex,torch,jax,verify]"]
test = ["pytest>=7.0", "numpy>=1.24", "scipy>=1.10"]
dev = ["omnibias-routing[all,test]", "ruff>=0.1.0", "mypy>=1.5"]

[project.urls]
Homepage = "https://github.com/derivon-ai/omnibias"
Documentation = "https://omnibias.ai/"
Source = "https://github.com/derivon-ai/omnibias"
Issues = "https://github.com/derivon-ai/omnibias/issues"
Changelog = "https://github.com/derivon-ai/omnibias/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["omnibias.*"]

[tool.setuptools.package-data]
"omnibias.routing" = ["py.typed"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
files = ["src/omnibias/routing"]
