[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnibias-hopfield"
version = "0.1.0a1"
description = "Modern Hopfield networks and attention-as-operator with closed-form log-sum-exp Jacobian/Hessian (torch + jax)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Vardan Grigoryants", email = "vardan@derivon.ai" }]
maintainers = [{ name = "Derivon", email = "info@derivon.ai" }]
keywords = ["hopfield-network", "associative-memory", "attention-mechanism"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["omnibias-core>=0.2.0", "omnibias-struct>=0.1.0a1"]

[project.optional-dependencies]
torch = ["torch>=2.0", "omnibias-torch>=0.2.0", "omnibias-struct[torch]>=0.1.0a1", "omnibias-curvature>=0.1.0a1"]
jax = ["jax>=0.4.30", "jaxlib>=0.4.30", "omnibias-jax>=0.2.0", "omnibias-struct[jax]>=0.1.0a1", "omnibias-curvature>=0.1.0a1"]
all = ["omnibias-hopfield[torch,jax]"]
test = ["pytest>=7.0", "numpy>=1.24"]
dev = ["omnibias-hopfield[all,test]", "ruff>=0.1.0", "mypy>=1.5"]

[project.urls]
Homepage = "https://github.com/derivon-ai/omnibias"
Documentation = "https://omnibias.ai/"
Source = "https://github.com/derivon-ai/omnibias"
Issues = "https://github.com/derivon-ai/omnibias/issues"
Changelog = "https://github.com/derivon-ai/omnibias/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["omnibias.*"]

[tool.setuptools.package-data]
"omnibias.hopfield" = ["py.typed"]
