[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnibias-combinatorics"
version = "0.1.0a1"
description = "Exact differentiable matching / flow / matroid layers for omnibias: entropic (Sinkhorn) relaxations onto the assignment / transportation / flow / matroid polytopes that anneal beta -> inf to a polytope vertex, decoded to a feasible solution, and sandwiched by a tight LP-dual optimality-gap certificate (Neumaier-Shcherbina, tight because these polytopes are integral). Best-in-class classical baselines (Hungarian / LP / max-flow / greedy). Bit-identical torch + jax twins."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later OR LicenseRef-omnibias-Commercial"
license-files = ["LICENSE"]
authors = [{ name = "Vardan Grigoryants", email = "vardan@derivon.ai" }]
maintainers = [{ name = "Derivon", email = "info@derivon.ai" }]
keywords = ["assignment-problem", "matching", "optimal-transport", "min-cost-flow", "matroid", "sinkhorn", "differentiable-optimization", "verified-numerics", "combinatorial-optimization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]
# omnibias-discrete supplies the AnnealSchedule homotopy + the decode / brute-force
# oracle; scipy supplies the exact classical baselines (Hungarian / LP / max-flow) and
# the LP dual for the certificate.
dependencies = ["omnibias-core>=0.2.0", "omnibias-discrete>=0.1.0a1", "numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
# the certificate's rigorous interval seal (Neumaier-Shcherbina) reuses the
# omnibias-convex verified LP bound; without it the certificate degrades to the
# (still valid) float LP value (certified=False).
convex = ["omnibias-convex>=0.1.0a1"]
# the differentiable relaxation layers reuse omnibias-graph's Sinkhorn / soft-top-k
# kernels (coordination, not duplication), so a tensor backend + graph are required.
torch = ["torch>=2.0", "omnibias-graph>=0.1.0a1"]
jax = ["jax>=0.4.30", "jaxlib>=0.4.30", "omnibias-graph>=0.1.0a1"]
graph = ["omnibias-graph>=0.1.0a1"]
all = ["omnibias-combinatorics[convex,torch,jax,graph]"]
test = ["pytest>=7.0", "numpy>=1.24", "scipy>=1.10"]
dev = ["omnibias-combinatorics[all,test]", "ruff>=0.1.0", "mypy>=1.5"]

[project.urls]
Homepage = "https://github.com/derivon-ai/omnibias"
Documentation = "https://omnibias.ai/"
Source = "https://github.com/derivon-ai/omnibias"
Issues = "https://github.com/derivon-ai/omnibias/issues"
Changelog = "https://github.com/derivon-ai/omnibias/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["omnibias.*"]

[tool.setuptools.package-data]
"omnibias.combinatorics" = ["py.typed"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
files = ["src/omnibias/combinatorics"]
