[mypy]
python_version = 3.10
strict = true
namespace_packages = true
explicit_package_bases = true
mypy_path =
    packages/omnibias-core/src,
    packages/omnibias-torch/src,
    packages/omnibias-jax/src,
    packages/omnibias-ferminet/src
exclude = (?x)(
    ^research/
    | ^results/
    | ^build/
    | ^dist/
    | ^docs/site/
    | ^tests/
    | ^packages/omnibias-(binary|spiking|pinn|curvature|symbolic|score|flow|hopfield)/
  )

# Backends are checked individually because they each pull in optional
# heavy deps. The CI matrix runs them in separate jobs.

[mypy-torch.*]
ignore_missing_imports = True

[mypy-jax.*]
ignore_missing_imports = True

[mypy-jaxlib.*]
ignore_missing_imports = True

[mypy-folx.*]
ignore_missing_imports = True

[mypy-ferminet.*]
ignore_missing_imports = True

[mypy-kfac_jax.*]
ignore_missing_imports = True

[mypy-pyscf.*]
ignore_missing_imports = True
