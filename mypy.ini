[mypy]
# Type against the locked CI runtime and its NumPy stubs. The minimum Python
# syntax is checked separately by compileall in the core-python CI matrix.
python_version = 3.12
strict = true
namespace_packages = true
explicit_package_bases = true
mypy_path = packages/omnibias-core/src,packages/omnibias-torch/src,packages/omnibias-jax/src
exclude = (?x)(^tests/|/tests/|^build/|^dist/)

[mypy-torch.*,jax.*,jaxlib.*,folx.*]
ignore_missing_imports = True
