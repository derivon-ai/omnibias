[tool.uv.workspace]
members = [
    "packages/omnibias-binary",
    "packages/omnibias-boolean",
    "packages/omnibias-convex",
    "packages/omnibias-core",
    "packages/omnibias-curvature",
    "packages/omnibias-difference",
    "packages/omnibias-discrete",
    "packages/omnibias-fields",
    "packages/omnibias-graph",
    "packages/omnibias-jax",
    "packages/omnibias-keras",
    "packages/omnibias-partition",
    "packages/omnibias-qcalculus",
    "packages/omnibias-sos",
    "packages/omnibias-struct",
    "packages/omnibias-torch",
]

[tool.uv]
package = false

[tool.uv.sources]
omnibias-binary = { workspace = true }
omnibias-boolean = { workspace = true }
omnibias-convex = { workspace = true }
omnibias-core = { workspace = true }
omnibias-curvature = { workspace = true }
omnibias-difference = { workspace = true }
omnibias-discrete = { workspace = true }
omnibias-fields = { workspace = true }
omnibias-graph = { workspace = true }
omnibias-jax = { workspace = true }
omnibias-keras = { workspace = true }
omnibias-partition = { workspace = true }
omnibias-qcalculus = { workspace = true }
omnibias-sos = { workspace = true }
omnibias-struct = { workspace = true }
omnibias-torch = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=7.0", "pytest-cov>=4.0", "pytest-timeout>=2.1",
    "ruff==0.15.17", "mypy>=1.5", "hypothesis>=6.0",
    "mpmath>=1.3", "scipy>=1.10", "build>=1.2", "twine>=5.0",
]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.24"]

[tool.pytest.ini_options]
testpaths = ["packages", "tests"]
pythonpath = ["tests", "benchmarks", "packages/omnibias-fields/tests", "packages/omnibias-struct/tests"]
addopts = "-m 'not slow' --import-mode=importlib --strict-markers"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:torch.*",
    "ignore::DeprecationWarning:jax.*",
    # NumPy 2 copy-keyword warning from Keras' upstream tensor conversion adapter.
    'ignore:.*__array__ implementation.*copy keyword.*:DeprecationWarning:keras\.src\.backend\.(torch|jax|tensorflow)\.core',
]
markers = [
    "slow: expensive optional checks", "slow_gpu: optional GPU check",
    "gpu: requires a GPU", "needs_research: requires an external experiment",
    "timeout: wall-clock limit (pytest-timeout)",
]

[tool.omnibias.license_tiers]
omnibias-binary = "permissive"
omnibias-boolean = "permissive"
omnibias-convex = "copyleft"
omnibias-core = "permissive"
omnibias-curvature = "permissive"
omnibias-difference = "permissive"
omnibias-discrete = "copyleft"
omnibias-fields = "permissive"
omnibias-graph = "permissive"
omnibias-jax = "permissive"
omnibias-keras = "permissive"
omnibias-partition = "permissive"
omnibias-qcalculus = "permissive"
omnibias-sos = "copyleft"
omnibias-struct = "permissive"
omnibias-torch = "permissive"

[tool.omnibias.license_expressions]
permissive = "Apache-2.0"
copyleft = "AGPL-3.0-or-later OR LicenseRef-omnibias-Commercial"
