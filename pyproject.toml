    "packages/omnibias-fields",
    "packages/omnibias-geometry",
    "packages/omnibias-fractional",
    "packages/omnibias-pinn",
    "packages/omnibias-qpinn",
    "packages/omnibias-curvature",
    "packages/omnibias-symbolic",
    "packages/omnibias-score",
    "packages/omnibias-variational",
    "packages/omnibias-hopfield",
    "packages/omnibias-convex",
    "packages/omnibias-boolean",
    "packages/omnibias-verify",
    "packages/omnibias-dynamics",
    "packages/omnibias-graph",
    "packages/omnibias-shape",
    "packages/omnibias-skills",
    "packages/omnibias-formal",
    "packages/omnibias-sos",
    "packages/omnibias-control",
    "packages/omnibias-routing",
    "packages/omnibias-discrete",
    "packages/omnibias-qubo",
    "packages/omnibias-submodular",
    "packages/omnibias-logic",
    "packages/omnibias-difference",
