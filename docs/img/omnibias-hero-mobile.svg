<svg xmlns="http://www.w3.org/2000/svg" width="600" height="870" viewBox="0 0 600 870" role="img" aria-labelledby="title desc">
  <title id="title">omnibias — Math that trains. Differentiate deeper. Make decisions differentiable.</title>
  <desc id="desc">Analytic derivative towers and smooth, trainable decisions for physics-informed learning. The upper diagram samples tanh and its first two derivatives. The lower diagram samples complementary sigmoid routing weights g and 1 minus g. Shared algebra on PyTorch, JAX and Keras, with retained parameter gradients.</desc>
