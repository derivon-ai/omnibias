<svg xmlns="http://www.w3.org/2000/svg" width="600" height="770" viewBox="0 0 600 770" role="img" aria-labelledby="title desc">
  <title id="title">omnibias — differentiate deeper; make decisions trainable</title>
  <desc id="desc">Taylor jets carry spatial derivatives into physics residuals. Soft gates route features into regional models. Both paths keep parameter gradients.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#081625"/>
      <stop offset="1" stop-color="#132842"/>
    </linearGradient>
    <linearGradient id="accent" x2="1">
      <stop stop-color="#65edd1"/>
      <stop offset="1" stop-color="#afbbff"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#bdd3ef" opacity=".10"/>
    </pattern>
  </defs>
  <rect width="600" height="770" rx="20" fill="url(#background)"/>
  <rect width="600" height="770" rx="20" fill="url(#grid)"/>
  <path d="M0 766H600" stroke="url(#accent)" stroke-width="8"/>
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <path d="M42 69Q56 46 69 69T96 69" fill="none" stroke="#65edd1" stroke-width="5" stroke-linecap="round"/>
    <text x="115" y="81" font-size="42" font-weight="700" letter-spacing="-1" fill="#f4f8ff">omnibias</text>
    <text x="40" y="168" font-size="45" font-weight="700" letter-spacing="-1.5" fill="#f4f8ff">Differentiate deeper.</text>
    <text x="40" y="224" font-size="48" font-weight="700" letter-spacing="-1.4" fill="#65edd1">Make decisions</text>
    <text x="40" y="279" font-size="48" font-weight="700" letter-spacing="-1.4" fill="#65edd1">trainable.</text>
    <g transform="translate(40 325)">
      <rect width="520" height="158" rx="14" fill="#102838" stroke="#284d59"/>
      <text x="24" y="44" font-size="28" font-weight="700" fill="#f4f8ff">Spatial derivatives</text>
      <text x="24" y="87" font-size="23" fill="#d7fff4">Coordinates → Taylor jets</text>
      <text x="24" y="124" font-size="23" fill="#d7fff4">→ physics residuals</text>
    </g>
    <g transform="translate(40 505)">
      <rect width="520" height="158" rx="14" fill="#192640" stroke="#39476c"/>
      <text x="24" y="44" font-size="28" font-weight="700" fill="#f4f8ff">Smooth decisions</text>
      <text x="24" y="87" font-size="23" fill="#e4e5ff">Features → soft gates</text>
      <text x="24" y="124" font-size="23" fill="#e4e5ff">→ regional models</text>
    </g>
    <text x="300" y="716" text-anchor="middle" font-size="23" fill="#b6c8df">Both keep parameter gradients.</text>
  </g>
</svg>
