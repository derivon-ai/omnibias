    <path d="M56 68H1224" stroke="#D8D7D2"/>
    <text x="51" y="180" font-size="94" letter-spacing="-5" font-weight="600">omnibias<tspan fill="#3654B3">.</tspan></text>
    <text x="56" y="250" font-size="39" letter-spacing="-1.2">High-order derivatives.</text>
    <text x="56" y="294" font-size="28" letter-spacing="-.5" fill="#3654B3">Direct. Trainable. Composable.</text>
    <text x="57" y="343" font-size="17" fill="#61646B">Analytic activation towers. Neural differential operators.</text>
    <text x="57" y="369" font-size="17" fill="#61646B">Built for physics-informed learning.</text>
