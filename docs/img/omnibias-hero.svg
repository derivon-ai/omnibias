  <title id="title">omnibias — high-order derivatives, direct and trainable</title>
  <desc id="desc">Analytic derivative towers for neural differential operators. A diagram shows tanh and its first two derivatives, paired with the Riccati derivative-polynomial identity. PyTorch, JAX and Keras.</desc>
