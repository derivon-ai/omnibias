version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"

  # Curated-core + representative alphas. Weekly is enough; Dependabot opens one
  # PR per ecosystem/directory. Keep directories aligned with packages that
  # publish or gate CI heavily.
  - package-ecosystem: "pip"
    directory: "/packages/omnibias-core"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  - package-ecosystem: "pip"
    directory: "/packages/omnibias-torch"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

