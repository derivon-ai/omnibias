# Generate a CycloneDX SBOM on release tags and upload it as a workflow artifact.
# SHA-pinned actions (see docs/ci-hardening.md).
name: sbom

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
      - "omnibias-*-v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    name: CycloneDX SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - name: Generate SBOM (anchore / Syft)
        uses: anchore/sbom-action@9246b90769f852b3a8921f330c59e0b3f439d6e9  # v0.20.1
        with:
          path: .
          format: cyclonedx-json
          output-file: omnibias-sbom.cyclonedx.json
          upload-artifact: false
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: omnibias-sbom
          path: omnibias-sbom.cyclonedx.json
          retention-days: 90
