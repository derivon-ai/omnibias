#
# Generate a CycloneDX SBOM on release tags and upload it as a workflow artifact.
# SHA-pinned actions.
name: sbom

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
      - "omnibias-*-v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    name: CycloneDX SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.11"
      - name: Generate SBOM (anchore / Syft)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: omnibias-sbom.cyclonedx.json
          upload-artifact: false
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: omnibias-sbom
          path: omnibias-sbom.cyclonedx.json
          retention-days: 90
