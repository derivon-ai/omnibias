#
# Prepare all primitive artifacts by default. Publication is an explicit choice.
# Trusted Publishing only; each project maps to this workflow and its environment.
name: release

on:
  push:
    tags:
      # Independent package versions; aggregate tags are deliberately unsupported.
      - "omnibias-*-v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      packages:
        description: "Primitive short-names (empty means all 16)"
        required: false
        default: ""
      repository:
        description: "Prepare artifacts, or explicitly select an upload target"
        required: true
        type: choice
        default: prepare
        options:
          - prepare
          - testpypi
          - pypi

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  build:
    needs: [verify]
    name: build primitive distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    permissions:
      contents: read
      # Required by actions/attest-build-provenance to mint the signed
      # attestation and record it in the public transparency log.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.11"
      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine packaging 'uv==0.12.1' readme-renderer[md]
      - name: Resolve retained package list
        id: select
        env:
          REQUESTED_PACKAGES: ${{ github.event.inputs.packages }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REPOSITORY: ${{ inputs.repository || 'prepare' }}
        run: python scripts/release_preflight.py
      - name: Build primitive sdists + wheels
        run: |
          for name in ${{ steps.select.outputs.pkgs }}; do
            python -m build "packages/omnibias-$name" --outdir dist/
          done
          ls -1 dist/
      - name: Validate distribution metadata
        run: twine check dist/*
      - name: Validate installed README examples from the built wheels
        run: |
          mkdir -p artifacts/release-wheels/wheels
          cp dist/*.whl artifacts/release-wheels/wheels/
          selected=""
          for name in ${{ steps.select.outputs.pkgs }}; do selected="$selected omnibias-$name"; done
          python scripts/validate_wheels.py --artifact-only --readme --python 3.11 --output artifacts/release-wheels --only $selected
      # SLSA build provenance: a signed, verifiable attestation that these exact
      # artifacts were produced by this workflow from this commit. Consumers
      # verify with `gh attestation verify <dist> --repo derivon-ai/omnibias`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-path: "dist/*"
      - name: Upload built distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: primitive-dist
          path: dist/
          retention-days: 7

  publish:
    name: publish ${{ matrix.package }} (${{ inputs.repository }})
    needs: [build]
    if: github.event_name == 'workflow_dispatch' && inputs.repository != 'prepare'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ matrix.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download prepared distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: primitive-dist
          path: all-dist/
      - name: Select exactly one distribution
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          mkdir dist
          cp all-dist/omnibias_${PACKAGE}-* dist/
          test "$(find dist -type f | wc -l)" -eq 2
      - name: Publish to the explicitly selected index
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc
        with:
          repository-url: ${{ inputs.repository == 'pypi' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
