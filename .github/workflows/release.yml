#
# Prepare all primitive artifacts by default. Publication is an explicit choice.
# Trusted Publishing only; each project maps to this workflow and its environment.
name: release

on:
  push:
    tags:
      # Independent package versions; aggregate tags are deliberately unsupported.
      - "omnibias-*-v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      packages:
        description: "Primitive short-names (empty means all 16)"
        required: false
        default: ""
      repository:
        description: "Prepare artifacts, or explicitly select an upload target"
        required: true
        type: choice
        default: prepare
        options:
          - prepare
          - testpypi
          - pypi
      prepared_run_id:
        description: "Successful main-branch preparation run; required for publication"
        required: false
      reuse_prepared_run_id:
        description: "Preparation only: preserve verified bytes of unchanged packages from this prior run"
        required: false
      resume:
        description: "Recover an interrupted upload after exact artifact hash verification"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: inputs.repository == 'prepare' || github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  build:
    needs: [verify]
    name: build primitive distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      # Required by actions/attest-build-provenance to mint the signed
      # attestation and record it in the public transparency log.
      id-token: write
      attestations: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.11"
      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine packaging 'uv==0.12.1' readme-renderer[md]
      - name: Resolve retained package list
        id: select
        env:
          REQUESTED_PACKAGES: ${{ github.event.inputs.packages }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REPOSITORY: ${{ inputs.repository || 'prepare' }}
        run: |
          # Validate an independent tag, then prepare the complete dependency cohort.
          python scripts/release_preflight.py
      - name: Build primitive sdists + wheels
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_PREPARED_RUN_ID: ${{ inputs.reuse_prepared_run_id }}
        run: python scripts/release_artifacts.py build
      - name: Validate distribution metadata
        run: |
          python scripts/check_packaging.py dist
          twine check dist/*.whl dist/*.tar.gz
      - name: Validate installed README examples from the built wheels
        run: |
          mkdir -p artifacts/release-wheels/wheels
          cp dist/*.whl artifacts/release-wheels/wheels/
          python scripts/validate_wheels.py --artifact-only --readme --python 3.11 --output artifacts/release-wheels
      - name: Seal complete release manifest
        run: python scripts/release_artifacts.py verify
      # SLSA build provenance: a signed, verifiable attestation that these exact
      # artifacts were produced by this workflow from this commit. Consumers
      # verify with `gh attestation verify <dist> --repo derivon-ai/omnibias`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-path: "dist/*"
      - name: Upload built distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: primitive-dist
          path: dist/
          retention-days: 90

  promote:
    if: github.event_name == 'workflow_dispatch' && inputs.repository != 'prepare'
    name: verify prepared artifacts and publication order
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      attestations: read
    outputs:
      matrix: ${{ steps.promote.outputs.matrix }}
      pending: ${{ steps.promote.outputs.pending }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - run: python -m pip install packaging
      - name: Verify preparation and stage missing files
        id: promote
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARED_RUN_ID: ${{ inputs.prepared_run_id }}
          REQUESTED_PACKAGES: ${{ inputs.packages }}
          RELEASE_REPOSITORY: ${{ inputs.repository }}
          RESUME_UPLOAD: ${{ inputs.resume }}
        run: python scripts/release_artifacts.py promote --directory prepared --output upload
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.promote.outputs.pending == 'true'
        with:
          name: verified-upload
          path: upload/
          retention-days: 7

  publish:
    name: publish ${{ matrix.package }} (${{ inputs.repository }})
    needs: [promote]
    if: needs.promote.outputs.pending == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.promote.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ matrix.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-upload
          path: upload/
      - name: Publish verified missing artifacts
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc
        with:
          verbose: true
          packages-dir: upload/${{ matrix.package }}/
          repository-url: ${{ inputs.repository == 'pypi' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
