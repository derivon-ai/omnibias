  keras:
    name: omnibias-keras (${{ matrix.keras_backend }} / py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [torch, jax]
    strategy:
      fail-fast: false
      # Three-way parity on one interpreter so the backends compare like with
      # like. The tensorflow leg is pinned to Python <=3.13 because TensorFlow
      # has no stable cp314 wheels yet; jax/torch legs stay on the same version
      # for apples-to-apples. Activation math across 3.10-3.14 is covered by
      # the core / torch / jax jobs. Raise the TF pin only after a tensorflow-cpu
      # wheel exists for the target CPython.
      matrix:
        include:
          - keras_backend: tensorflow
            python-version: "3.13"
          - keras_backend: jax
            python-version: "3.13"
          - keras_backend: torch
            python-version: "3.13"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (keras + torch + jax so the three-way parity test runs)
        run: |
          python -m venv .venv-keras
          source .venv-keras/bin/activate
          pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install jax jaxlib
          if [ "${{ matrix.keras_backend }}" = "tensorflow" ]; then pip install tensorflow-cpu; fi
          pip install -e packages/omnibias-core
          pip install -e packages/omnibias-torch
          pip install -e packages/omnibias-jax
          pip install -e "packages/omnibias-keras[test]"
      - name: Run keras package tests (own pytest config)
        env:
          KERAS_BACKEND: ${{ matrix.keras_backend }}
        run: |
          source $GITHUB_WORKSPACE/.venv-keras/bin/activate
          cd packages/omnibias-keras
          python -m pytest tests -q
      - name: Run three-way (torch/jax/keras) parity test
        env:
          KERAS_BACKEND: ${{ matrix.keras_backend }}
        run: |
          source .venv-keras/bin/activate
          python -m pytest tests/test_keras_parity.py -q

  docs:
    name: mkdocs --strict
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - name: Install docs deps + every public package (for mkdocstrings)
        run: |
          python -m venv .venv-docs
          source .venv-docs/bin/activate
          pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install keras
          pip install "mkdocs-material>=9.5" "mkdocstrings[python]>=0.24" pytest
          for pkg in core torch jax ferminet fields pinn qpinn curvature geometry fractional measure score variational symbolic binary boolean verify dynamics difference qcalculus timescale holonomic spiking hopfield graph shape formal sos convex control routing discrete qubo submodular nphard combinatorics logic struct tab partition keras skills; do
            pip install -e packages/omnibias-$pkg
          done
      - name: Build docs strict
        env:
          KERAS_BACKEND: torch
        run: |
          source .venv-docs/bin/activate
          mkdocs build --strict
      # Every distribution is installed in this job, so the docs path guard is
      # fully armed here (in the core job it can only check omnibias.core.*).
      - name: Guard - every dotted omnibias.* path in the docs resolves
        env:
          KERAS_BACKEND: torch
        run: |
          source .venv-docs/bin/activate
          python -m pytest packages/omnibias-core/tests/test_doc_module_paths.py -q
      - name: Upload Pages artefact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: site

  docs_deploy:
    name: deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
        id: deployment

  # Docs rot silently: a renamed symbol keeps rendering fine in mkdocs while every
  # reader who copies the snippet hits a traceback. This job *runs* the documented
  # code. Blocks are executed by default; opting out needs a stated reason in the
  # markdown (see the doc-testing contract in CONTRIBUTING.md).
  docs_snippets:
    name: docs snippets execute
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - name: Install CPU torch, keras + every public package
        run: |
          python -m venv .venv-snippets
          source .venv-snippets/bin/activate
          pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install keras pytest
          for pkg in core torch jax ferminet fields pinn qpinn curvature geometry fractional measure score variational symbolic binary boolean verify dynamics difference qcalculus timescale holonomic spiking hopfield graph shape formal sos convex control routing discrete qubo submodular nphard combinatorics logic struct tab partition keras skills; do
            pip install -e packages/omnibias-$pkg
          done
      # The default `-m 'not slow'` from pyproject excludes the documents that
      # carry a `docs-test: slow` block (training runs, lattice Monte Carlo).
      # Every distribution is installed here, so a documented `omnibias.*` import
      # that no longer resolves is a hard failure rather than a skip.
      - name: Execute every documented python block (fast set)
        env:
          KERAS_BACKEND: torch
          OMNIBIAS_DOCS_SNIPPETS_STRICT: "1"
        run: |
          source .venv-snippets/bin/activate
          python -m pytest tests/test_docs_snippets.py -q
      # The heavy documents are real code, so they are verified too -- just not on
      # every pull request.
      - name: Execute the slow documents (scheduled / dispatched only)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          KERAS_BACKEND: torch
          OMNIBIAS_DOCS_SNIPPETS_STRICT: "1"
          OMNIBIAS_DOCS_SNIPPET_TIMEOUT: "1800"
        run: |
          source .venv-snippets/bin/activate
          python -m pytest tests/test_docs_snippets.py -q -m slow

  # The notebook gallery promises "CPU in under ~2 minutes, fixed seeds, no
  # external data". This job holds that promise to account. It is heavier than a
  # per-PR check, so it runs on the weekly schedule (or on demand).
  notebooks:
    name: notebook gallery executes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - name: Install CPU torch, plotting deps + every public package
        run: |
          python -m venv .venv-nb
          source .venv-nb/bin/activate
          pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install keras matplotlib scipy pandas nbconvert ipykernel
          for pkg in core torch jax ferminet fields pinn qpinn curvature geometry fractional measure score variational symbolic binary boolean verify dynamics difference qcalculus timescale holonomic spiking hopfield graph shape formal sos convex control routing discrete qubo submodular nphard combinatorics logic struct tab partition keras skills; do
            pip install -e packages/omnibias-$pkg
          done
          # Name the kernel explicitly: a notebook's default `python3` kernelspec
          # can resolve to some other interpreter, which then fails on unrelated
          # version skew rather than on the notebook.
          python -m ipykernel install --user --name omnibias-ci
      # `_style` / `_fields` are sibling helper modules, so the notebook directory
      # has to be the working directory; `examples` imports need the repo root.
      - name: Execute every notebook
        env:
          KERAS_BACKEND: torch
          MPLBACKEND: Agg
          PYTHONPATH: ${{ github.workspace }}
        run: |
          source .venv-nb/bin/activate
          cd notebooks
          for nb in *.ipynb; do
            echo "::group::$nb"
            jupyter nbconvert --to notebook --execute --stdout \
              --ExecutePreprocessor.kernel_name=omnibias-ci \
              --ExecutePreprocessor.timeout=600 "$nb" > /dev/null
            echo "::endgroup::"
          done

  build_wheels:
    name: build + twine-check every distribution
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine
      - name: Build sdist + wheel for every publishable package
        run: |
          for d in packages/omnibias-*/; do
            python -m build "$d" --outdir dist/
          done
          ls -1 dist/
      - name: Validate distribution metadata (PyPI-renderable, well-formed)
        run: twine check dist/*
      - name: Verify distributions carry no packaging junk
        run: python scripts/check_packaging.py dist/
      - name: Upload built distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: omnibias-dist
          path: dist/
          retention-days: 7

  wheel_import_smoke:
    name: wheel import smoke (every distribution)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [build_wheels]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - name: Download built distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: omnibias-dist
          path: dist/
      - name: Install every wheel into one clean venv (CPU backends)
        run: |
          python -m venv .venv-smoke
          source .venv-smoke/bin/activate
          pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          # A generous scientific stack so optional top-level imports resolve.
          pip install jax keras numpy scipy pandas scikit-learn sympy networkx
          # Install every built wheel; sibling omnibias deps resolve from dist/.
          pip install --find-links dist/ dist/omnibias_*.whl
      - name: Import every shipped top-level package
        env:
          KERAS_BACKEND: torch
          JAX_PLATFORMS: cpu
        run: |
          source .venv-smoke/bin/activate
          python scripts/import_smoke.py

  curated_clean_install:
    name: curated-core clean install (${{ matrix.pkg }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build_wheels]
    strategy:
      fail-fast: false
      matrix:
        pkg: [core, torch, jax, ferminet, keras, fields, pinn, geometry]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - name: Download built distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: omnibias-dist
          path: dist/
      - name: Clean-venv install from wheel + import
        env:
          KERAS_BACKEND: torch
          JAX_PLATFORMS: cpu
        run: |
          python -m venv .venv-ci
          source .venv-ci/bin/activate
          pip install --upgrade pip
          # Pre-provide CPU torch so torch-dependent curated packages do not pull
          # the default (GPU) wheel; jax + keras cover the other backends. The
          # omnibias package itself + its omnibias deps resolve from local dist/.
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install jax keras
          pip install --find-links dist/ omnibias-${{ matrix.pkg }}
          python -c "import importlib; m = importlib.import_module('omnibias.${{ matrix.pkg }}'); print('import OK:', m.__name__)"

  curated_api:
    name: curated-core public API surface (frozen)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [torch, jax]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - name: Install curated-core packages + pytest
        run: |
          python -m venv .venv-api
          source .venv-api/bin/activate
          pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install keras pytest
          pip install -e packages/omnibias-core
          pip install -e packages/omnibias-torch
          pip install -e packages/omnibias-jax
          pip install -e packages/omnibias-ferminet
          pip install -e "packages/omnibias-fields[torch,jax]"
          pip install -e "packages/omnibias-pinn[torch,jax]"
          pip install -e "packages/omnibias-geometry[torch,jax]"
          pip install -e packages/omnibias-keras
      - name: Assert the frozen public API surface is unchanged
        env:
          KERAS_BACKEND: torch
          JAX_PLATFORMS: cpu
        run: |
          source .venv-api/bin/activate
          python -m pytest tests/test_curated_core_api_surface.py -q
