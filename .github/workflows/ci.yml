name: ci

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  # Weekly, for the jobs too heavy to run per pull request (the `slow` documents
  # and the notebook smoke run).
  schedule:
    - cron: "17 4 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: ruff + mypy (T1)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          enable-cache: true
          version: "0.5.x"
      - run: uv sync --all-extras --dev
      - run: uv run ruff check packages tests
      # mypy --strict is scoped to the workspace (T1) packages here. The curated
      # beta packages' authored-strict `_core` substrate (fields / geometry) is
      # gated incrementally by the separate `mypy_curated_beta` job; the remaining
      # extension packages' bulk-copied field-ops stay off the gate until
      # refactored (tracked strict-typing follow-up).
      - run: uv run mypy --strict packages/omnibias-core/src packages/omnibias-torch/src packages/omnibias-jax/src packages/omnibias-ferminet/src

  links:
    name: docs & markdown link check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      # Offline link + image checker: verifies that every relative link and
      # local image in the README, the root governance docs, and the docs/ tree
      # resolves on disk. This is the guard that catches a missing figure (e.g.
      # an un-generated docs/img/*.png) or a doc renamed out from under a link.
      # External http(s) URLs are skipped (--offline) to keep the job
      # deterministic and free of network flake.
      - name: Link + image checker (lychee)
        uses: lycheeverse/lychee-action@f613c4a64e50d792e0b31ec34bbcbba12263c6a6  # v2.3.0
        with:
          args: "--offline --no-progress '*.md' 'docs/**/*.md'"
          fail: true

  guards:
    name: release guards (licence / placeholders / version / leakage)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      # Static, dependency-light release guards: most only read the tracked
      # tree (no package import). omnibias-core is installed so
      # test_all_resolves can import the public package and resolve __all__.
      - run: |
          pip install pytest
          pip install -e packages/omnibias-core
      - name: Legal-identity, version, leakage/secret, honesty, and packaging scans
        run: |
          python -m pytest \
            packages/omnibias-core/tests/test_no_placeholders.py \
            packages/omnibias-core/tests/test_version_consistency.py \
            packages/omnibias-core/tests/test_no_leakage.py \
            packages/omnibias-core/tests/test_concept_terminology.py \
            packages/omnibias-core/tests/test_license_consistency.py \
            packages/omnibias-core/tests/test_lineage_declared.py \
            packages/omnibias-core/tests/test_all_sorted.py \
            packages/omnibias-core/tests/test_all_resolves.py \
            packages/omnibias-core/tests/test_py_typed.py \
            -q
      # The header of every file is derived from the licence-tier table, so a
      # hand-written one is always either redundant or wrong. The test above
      # asserts the invariant; this reports the exact fix command.
      - name: SPDX headers match the licence tier table
        run: python scripts/license_headers.py --check

  mypy_curated_beta:
    name: mypy --strict (curated beta substrate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      # The curated beta packages (fields / geometry) and the authored-strict
      # omnibias.pinn.operator surface are not on the blanket strict gate
      # (bulk-copied torch/jax field-ops carry no-any-return / type-arg
      # findings; a tracked strict-typing follow-up). Their authored-strict
      # modules are gated incrementally via scripts/mypy_strict_allowlist.txt
      # (`--follow-imports=silent`).
      - name: Install curated beta packages + mypy
        run: |
          python -m venv .venv-mypy-beta
          source .venv-mypy-beta/bin/activate
          pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install "mypy>=1.5"
          pip install -e packages/omnibias-core
          pip install -e packages/omnibias-torch
          pip install -e packages/omnibias-jax
          pip install -e "packages/omnibias-fields[torch,jax]"
          pip install -e "packages/omnibias-geometry[torch,jax]"
          pip install -e "packages/omnibias-pinn[torch,jax]"
      - name: Strict-check the authored-strict substrate allowlist
        run: |
          source .venv-mypy-beta/bin/activate
          python scripts/mypy_strict_check.py

  # Interpreter policy: 3.14 is the development target, 3.10 is the supported
  # floor, and the three backend-bearing jobs (core / torch / jax) test the whole
  # span so backward compatibility is measured rather than assumed. `ruff` and
  # `mypy` deliberately target the *floor* (py310) in the lint job, so a 3.11+
  # only construct is caught even when developing on 3.14. The single-version
  # jobs below sit on 3.11 to keep the matrix affordable; the classifier guard in
  # test_package_registry.py fails if this span and the advertised classifiers
  # ever diverge.
  core:
    name: omnibias-core (no torch / no jax)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (clean venv, core only)
        run: |
          python -m venv .venv-core
          source .venv-core/bin/activate
          pip install --upgrade pip
          pip install -e packages/omnibias-core[test]
      - name: Run pure-Python tests (coverage floor)
        run: |
          source .venv-core/bin/activate
          # Modest floor so regressions are caught without blocking a thin day;
          # raise after the next coverage pass (see docs/ci-hardening.md).
          # Scoped to omnibias.core: this job installs core only.
          python -m pytest packages/omnibias-core/tests -x -q \
            --cov=omnibias.core --cov-fail-under=60

  torch:
    name: omnibias-torch
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m venv .venv-torch
          source .venv-torch/bin/activate
          pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e packages/omnibias-core
          pip install -e packages/omnibias-torch[test]
      - name: Run torch tests
        run: |
          source .venv-torch/bin/activate
          python -m pytest packages/omnibias-torch/tests -x -q

  jax:
    # JAX upstream may raise its floor (historically 3.10, then 3.11/3.12). If a
    # matrix cell fails solely because jax/jaxlib has no wheel for that CPython,
    # that is an upstream constraint, not an omnibias regression -- document and
    # exclude the cell rather than loosening requires-python on omnibias-jax.
    name: omnibias-jax
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m venv .venv-jax
          source .venv-jax/bin/activate
          pip install --upgrade pip
          pip install -e packages/omnibias-core
          pip install -e packages/omnibias-jax[test]
      - name: Run jax tests
        run: |
          source .venv-jax/bin/activate
          python -m pytest packages/omnibias-jax/tests -x -q

  ferminet:
    name: omnibias-ferminet
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m venv .venv-fn
          source .venv-fn/bin/activate
          pip install --upgrade pip
          pip install -e packages/omnibias-core
          pip install -e packages/omnibias-jax
          pip install -e packages/omnibias-ferminet[test]
      - name: Run ferminet bridge tests
        run: |
          source .venv-fn/bin/activate
          python -m pytest packages/omnibias-ferminet/tests -x -q

  cross_backend:
    name: cross-backend parity (torch + jax)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [torch, jax]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m venv .venv-cross
          source .venv-cross/bin/activate
          pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e packages/omnibias-core
          pip install -e packages/omnibias-torch
          pip install -e packages/omnibias-jax
          pip install -e packages/omnibias-ferminet
          # Independent oracles for the closed-form integral transforms:
          # measure supplies the quadrature and fractional the Lerch series.
          # Both are test-only -- test_transforms_parity.py asserts that neither
          # backend imports them -- but without them installed those checks would
          # importorskip rather than run, which defeats the point of having them.
          pip install -e packages/omnibias-fields
          pip install -e packages/omnibias-measure
          pip install -e "packages/omnibias-fractional[torch]"
          pip install pytest
      - name: Run cross-backend parity tests
        run: |
          source .venv-cross/bin/activate
          python -m pytest tests/ -x -q
      - name: Run the closed-form integral-transform example (smoke)
        run: |
          source .venv-cross/bin/activate
          JAX_PLATFORMS=cpu python docs/examples/transforms_closed_form.py

  pinn:
    name: omnibias-pinn (beta)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [torch, jax]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m venv .venv-pinn
          source .venv-pinn/bin/activate
          pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e packages/omnibias-core
          pip install -e packages/omnibias-torch
          pip install -e packages/omnibias-jax
          pip install -e packages/omnibias-fields
          pip install -e packages/omnibias-partition
          # Quadrature for the Fredholm / Volterra residuals; without it those
          # tests would silently skip rather than run.
          pip install -e packages/omnibias-measure
          pip install -e "packages/omnibias-pinn[torch,jax,test]"
      - name: Run pinn tests (no research deps, no GPU)
        run: |
          source .venv-pinn/bin/activate
          python -m pytest packages/omnibias-pinn/tests -q -m "not needs_research and not gpu and not slow_gpu"
      - name: Run the second-order solver-training example (smoke)
        run: |
          source .venv-pinn/bin/activate
          python docs/examples/pinn_solver_curvature.py
      - name: Run the inverse-problem / adaptive-collocation example (smoke)
        run: |
          source .venv-pinn/bin/activate
          python docs/examples/pinn_solver_inverse.py
      - name: Run the Fourier-feature / spectral-bias example (smoke)
        run: |
          source .venv-pinn/bin/activate
          python docs/examples/pinn_fourier_features.py
      - name: Run the measured-frequency-band example (smoke)
        run: |
          source .venv-pinn/bin/activate
          python docs/examples/pinn_multiscale_feedback.py
      - name: Run the conservation-cage / attention-field example (smoke)
        run: |
          source .venv-pinn/bin/activate
          python docs/examples/pinn_conservation_attention.py
      - name: Run the XPINN-interface / stiff-integrator example (smoke)
        run: |
          source .venv-pinn/bin/activate
          python docs/examples/pinn_xpinn_stiff.py
      - name: Run the partition-of-unity interface example (smoke)
        run: |
          source .venv-pinn/bin/activate
          python docs/examples/partitioned_pinn.py
      - name: Run the conservative shock-capturing Burgers example (smoke)
        run: |
          source .venv-pinn/bin/activate
          python docs/examples/pinn_burgers_shock.py
      - name: Run the hard boundary / initial condition example (smoke)
        run: |
          source .venv-pinn/bin/activate
          python docs/examples/pinn_hard_conditions.py
      - name: Run the operator-learning example (smoke)
        run: |
          source .venv-pinn/bin/activate
          python docs/examples/pinn_operator_learning.py
      - name: Run PINN limitation-mitigation example smokes
        run: |
          source .venv-pinn/bin/activate
          python docs/examples/pinn_causal_marching.py
          python docs/examples/pinn_sdf_geometry.py
          python docs/examples/pinn_fbpinn.py
      - name: Run PINN four-gap benchmark smokes
        run: |
          source .venv-pinn/bin/activate
          python benchmarks/causal_marching.py
          python benchmarks/geometry_sdf.py
          python benchmarks/operator_zero_shot.py
          python benchmarks/spectral_bias_fbpinn.py

  qpinn:

    name: omnibias-qpinn (alpha)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [torch, jax]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m venv .venv-qpinn
          source .venv-qpinn/bin/activate
          pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e packages/omnibias-core
          pip install -e packages/omnibias-torch
          pip install -e packages/omnibias-jax
          pip install -e packages/omnibias-fields
          pip install -e packages/omnibias-pinn
          pip install -e "packages/omnibias-qpinn[torch,jax,test]"
      - name: Run qpinn tests (no GPU, skip integration on default runner)
        run: |
          source .venv-qpinn/bin/activate
          python -m pytest packages/omnibias-qpinn/tests \
            --ignore=packages/omnibias-qpinn/tests/integration \
            -q -m "not gpu and not slow_gpu"

  curvature:
    name: omnibias-curvature (alpha)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [jax]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m venv .venv-curv
          source .venv-curv/bin/activate
          pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e packages/omnibias-core
          pip install -e packages/omnibias-jax
          pip install -e packages/omnibias-torch
          pip install -e "packages/omnibias-curvature[test]"
      - name: Run curvature tests
        run: |
          source .venv-curv/bin/activate
          python -m pytest packages/omnibias-curvature/tests -x -q
      - name: Run certified rank-collapse example (smoke)
        run: |
          source .venv-curv/bin/activate
          JAX_PLATFORMS=cpu python docs/examples/certified_rank_collapse.py
      - name: Run information-geometry Fisher degeneracy smoke (04-01 G2)
        run: |
          source .venv-curv/bin/activate
          python benchmarks/information_geometry.py
      - name: Run inverse-imaging localization scaling smoke (05-01 G7)
        run: |
          source .venv-curv/bin/activate
          python benchmarks/inverse_imaging.py

  fields:
    name: omnibias-fields (beta)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [torch, jax]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m venv .venv-fields
          source .venv-fields/bin/activate
          pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e packages/omnibias-core
          pip install -e packages/omnibias-torch
          pip install -e packages/omnibias-jax
          pip install -e "packages/omnibias-fields[torch,jax,test]"
      - name: Run fields tests
        run: |
          source .venv-fields/bin/activate
          python -m pytest packages/omnibias-fields/tests -q

  geometry:
    name: omnibias-geometry (beta)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [torch, jax]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m venv .venv-geom
          source .venv-geom/bin/activate
          pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e packages/omnibias-core
          pip install -e packages/omnibias-torch
          pip install -e packages/omnibias-jax
          pip install -e packages/omnibias-fields
          pip install -e packages/omnibias-partition
          pip install -e "packages/omnibias-geometry[torch,jax,test]"
      - name: Run geometry tests
        run: |
          source .venv-geom/bin/activate
          python -m pytest packages/omnibias-geometry/tests -q
      - name: Run certified lattice mass-gap example (smoke)
        run: |
          source .venv-geom/bin/activate
          python docs/examples/gauge_certified_mass_gap.py

  binary:
    name: omnibias-binary (alpha)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [torch, jax]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m venv .venv-binary
          source .venv-binary/bin/activate
          pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e packages/omnibias-core
          pip install -e "packages/omnibias-binary[torch,jax,test]"
      - name: Run binary tests
        run: |
          source .venv-binary/bin/activate
          python -m pytest packages/omnibias-binary/tests -q

  binary_vs_ste:
    name: examples/binary_vs_ste (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [torch, jax]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m venv .venv-bvs
          source .venv-bvs/bin/activate
          pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e packages/omnibias-core
          pip install -e packages/omnibias-torch
          pip install -e "packages/omnibias-binary[torch]"
      - name: Run binary-vs-STE example smoke (synthetic data, offline)
        run: |
          source .venv-bvs/bin/activate
          python -m pytest examples/binary_vs_ste/tests -q

  boolean:
    name: omnibias-boolean (alpha)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [torch, jax]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m venv .venv-boolean
          source .venv-boolean/bin/activate
          pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e packages/omnibias-core
          pip install -e packages/omnibias-torch
          pip install -e packages/omnibias-jax
          pip install -e "packages/omnibias-binary[torch,jax]"
          pip install -e "packages/omnibias-boolean[torch,jax,test]"
      - name: Run boolean tests
        run: |
          source .venv-boolean/bin/activate
          python -m pytest packages/omnibias-boolean/tests -q
      - name: Run RSA-limitation example smoke (reproducible tiny case)
