    name: lean verified kernel (golden replay)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [core]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - name: Install elan / Lean (toolchain pinned by lean-toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.31.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build the verified kernel (kernel-checks the golden certificates)
        run: |
          cd formal/omnibias-verified-kernel
          lake build
      - name: Replay golden certificates through the Python bridge (lake on PATH)
        run: |
          python -m venv .venv-lean
          source .venv-lean/bin/activate
          pip install --upgrade pip
          pip install -e packages/omnibias-core[test]
